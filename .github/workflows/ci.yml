name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Syntax check JavaScript files
        run: |
          for f in *.js tests/*.js; do
            node --check "$f"
          done

      - name: Run unit and UI tests
        run: node --test tests/*.test.js

      - name: Package and verify extension zip
        run: |
          zip -r cue-chrome-palette-ci.zip manifest.json *.js *.html *.css
          node <<'EOF'
            const { execFileSync } = require("node:child_process");
            const fs = require("node:fs");
            const entries = new Set(
              execFileSync("unzip", ["-Z1", "cue-chrome-palette-ci.zip"], { encoding: "utf8" })
                .split(/\r?\n/)
                .filter(Boolean)
            );
            const manifest = JSON.parse(fs.readFileSync("manifest.json", "utf8"));
            const required = new Set(["manifest.json"]);
            if (manifest.background?.service_worker) required.add(manifest.background.service_worker);
            if (manifest.action?.default_popup) required.add(manifest.action.default_popup);
            if (manifest.options_page) required.add(manifest.options_page);
            for (const cs of manifest.content_scripts || []) {
              for (const f of cs.js || []) required.add(f);
            }
            for (const war of manifest.web_accessible_resources || []) {
              for (const f of war.resources || []) required.add(f);
            }
            for (const htmlFile of ["palette-frame.html", "popup.html", "options.html"]) {
              required.add(htmlFile);
              const html = fs.readFileSync(htmlFile, "utf8");
              for (const m of html.matchAll(/<script\b[^>]*\bsrc=["']([^"']+)["'][^>]*>/gi)) {
                required.add(m[1]);
              }
              for (const m of html.matchAll(/<link\b[^>]*>/gi)) {
                if (/\brel=["']stylesheet["']/i.test(m[0])) {
                  const href = /\bhref=["']([^"']+)["']/i.exec(m[0]);
                  if (href) required.add(href[1]);
                }
              }
            }
            const missing = [...required].filter((f) => !entries.has(f));
            if (missing.length > 0) {
              console.error("Missing required files in zip:", missing);
              process.exit(1);
            }
            console.log("Verified", required.size, "required extension files in cue-chrome-palette-ci.zip");
          EOF

      - name: Upload extension zip artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cue-chrome-palette-ci
          path: cue-chrome-palette-ci.zip
          if-no-files-found: error
